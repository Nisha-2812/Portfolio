<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Illustrated placeholder portrait">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1f3d"/>
      <stop offset="100%" stop-color="#2e1c4d"/>
    </linearGradient>
    <linearGradient id="pf-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ac7ff"/>
      <stop offset="100%" stop-color="#7c6bff"/>
    </linearGradient>
    <linearGradient id="pf-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2140"/>
      <stop offset="100%" stop-color="#171029"/>
    </linearGradient>
    <linearGradient id="pf-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ac7ff"/>
      <stop offset="100%" stop-color="#7c6bff"/>
    </linearGradient>
    <radialGradient id="pf-glow">
      <stop offset="0%" stop-color="#7c6bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c6bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pf-clip">
      <rect width="512" height="512"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pf-clip)">
    <rect width="512" height="512" fill="url(#pf-bg)"/>
    <circle cx="256" cy="196" r="230" fill="url(#pf-glow)"/>

    <!-- Decorative rings -->
    <circle cx="256" cy="256" r="188" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" stroke-dasharray="6 10"/>

    <!-- Shoulders / torso -->
    <path d="M108 512c0-84 66-146 148-146s148 62 148 146z" fill="url(#pf-shirt)" opacity="0.85"/>
    <path d="M232 372h48v34a24 24 0 0 1-48 0z" fill="#e8b89a"/>

    <!-- Neck shadow -->
    <path d="M232 372h48v14a24 24 0 0 1-48 0z" fill="#c9997d"/>

    <!-- Head -->
    <ellipse cx="256" cy="286" rx="76" ry="88" fill="#f0c3a4"/>

    <!-- Hair -->
    <path d="M256 176c-52 0-88 36-88 84 0 18 4 34 10 46 3-30 8-52 18-66 22 14 52 20 84 14 20-4 34-12 42-22 8 16 12 42 14 74 8-14 12-30 12-46 0-48-40-84-92-84z" fill="url(#pf-hair)"/>
    <path d="M172 268c-10 30-8 62 6 92-22-26-30-62-22-96z" fill="url(#pf-hair)"/>
    <path d="M340 268c10 30 8 62-6 92 22-26 30-62 22-96z" fill="url(#pf-hair)"/>

    <!-- Eyes -->
    <ellipse cx="228" cy="288" rx="7" ry="9" fill="#2b2140"/>
    <ellipse cx="284" cy="288" rx="7" ry="9" fill="#2b2140"/>
    <path d="M214 272c8-6 20-6 28 0" fill="none" stroke="#2b2140" stroke-width="5" stroke-linecap="round"/>
    <path d="M270 272c8-6 20-6 28 0" fill="none" stroke="#2b2140" stroke-width="5" stroke-linecap="round"/>

    <!-- Nose + smile -->
    <path d="M256 296v14" fill="none" stroke="#d9a082" stroke-width="4" stroke-linecap="round"/>
    <path d="M238 328c11 10 25 10 36 0" fill="none" stroke="#c9756a" stroke-width="5" stroke-linecap="round"/>

    <!-- Accent chip on shoulder -->
    <rect x="300" y="440" width="88" height="26" rx="13" fill="#0d1024" opacity="0.5"/>
    <circle cx="318" cy="453" r="5" fill="url(#pf-acc)"/>
    <rect x="332" y="449" width="44" height="7" rx="3.5" fill="#ffffff" opacity="0.35"/>

    <!-- Floating dots -->
    <circle cx="92" cy="150" r="7" fill="#3ac7ff" opacity="0.8"/>
    <circle cx="424" cy="196" r="5" fill="#7c6bff" opacity="0.8"/>
    <circle cx="404" cy="98" r="4" fill="#3ac7ff" opacity="0.55"/>
    <circle cx="112" cy="330" r="4" fill="#7c6bff" opacity="0.5"/>
  </g>
</svg>
