<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="FluxPay fintech payment app mockup">
  <defs>
    <linearGradient id="fp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#1a1038"/>
    </linearGradient>
    <linearGradient id="fp-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ac7ff"/>
      <stop offset="100%" stop-color="#7c6bff"/>
    </linearGradient>
    <radialGradient id="fp-glow1">
      <stop offset="0%" stop-color="#3ac7ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3ac7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fp-glow2">
      <stop offset="0%" stop-color="#7c6bff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c6bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fp-bg)"/>
  <circle cx="180" cy="120" r="200" fill="url(#fp-glow1)"/>
  <circle cx="640" cy="400" r="220" fill="url(#fp-glow2)"/>

  <!-- Phone frame -->
  <g transform="translate(96 46)">
    <rect x="0" y="0" width="230" height="410" rx="34" fill="#12172c" stroke="#2a3050" stroke-width="1.5"/>
    <rect x="9" y="9" width="212" height="392" rx="27" fill="#0e1326"/>
    <rect x="92" y="20" width="46" height="6" rx="3" fill="#2a3050"/>

    <text x="24" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b90a8">Total balance</text>
    <text x="24" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#f4f4f7">₹48,250</text>
    <rect x="24" y="100" width="54" height="4" rx="2" fill="url(#fp-acc)"/>

    <!-- Payment card -->
    <rect x="24" y="120" width="182" height="96" rx="16" fill="url(#fp-acc)"/>
    <rect x="38" y="140" width="26" height="18" rx="4" fill="#ffffff" opacity="0.55"/>
    <text x="38" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#08111f" letter-spacing="2">**** 4829</text>
    <text x="38" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#08111f" opacity="0.7">FLUXPAY DEBIT</text>
    <circle cx="176" cy="196" r="10" fill="#ffffff" opacity="0.35"/>
    <circle cx="188" cy="196" r="10" fill="#ffffff" opacity="0.25"/>

    <!-- Quick actions -->
    <g>
      <rect x="24" y="232" width="42" height="42" rx="13" fill="#1a2140"/>
      <path d="M45 244v18M36 253h18" stroke="#3ac7ff" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="71" y="232" width="42" height="42" rx="13" fill="#1a2140"/>
      <path d="M83 258l9-9 9 9" stroke="#7c6bff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <rect x="118" y="232" width="42" height="42" rx="13" fill="#1a2140"/>
      <rect x="130" y="244" width="18" height="18" rx="4" stroke="#3ac7ff" stroke-width="2.5" fill="none"/>
      <rect x="165" y="232" width="41" height="42" rx="13" fill="#1a2140"/>
      <circle cx="185" cy="253" r="8" stroke="#7c6bff" stroke-width="2.5" fill="none"/>
    </g>

    <text x="24" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#8b90a8">Recent activity</text>

    <!-- Transaction rows -->
    <g>
      <rect x="24" y="312" width="182" height="34" rx="11" fill="#151b33"/>
      <circle cx="42" cy="329" r="10" fill="#3ac7ff" opacity="0.25"/>
      <rect x="60" y="322" width="62" height="6" rx="3" fill="#3a4166"/>
      <rect x="60" y="333" width="40" height="5" rx="2.5" fill="#272d4a"/>
      <text x="196" y="333" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#34d399">+₹1,200</text>

      <rect x="24" y="352" width="182" height="34" rx="11" fill="#151b33"/>
      <circle cx="42" cy="369" r="10" fill="#7c6bff" opacity="0.25"/>
      <rect x="60" y="362" width="54" height="6" rx="3" fill="#3a4166"/>
      <rect x="60" y="373" width="34" height="5" rx="2.5" fill="#272d4a"/>
      <text x="196" y="373" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#f4f4f7">−₹640</text>
    </g>
  </g>

  <!-- Floating side cards -->
  <g transform="translate(380 92)">
    <rect x="0" y="0" width="196" height="74" rx="16" fill="#151b33" stroke="#2a3050" stroke-width="1.2" opacity="0.96"/>
    <text x="18" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b90a8">Split a bill</text>
    <text x="18" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f4f4f7">₹1,840</text>
    <circle cx="150" cy="42" r="12" fill="#3ac7ff" opacity="0.35"/>
    <circle cx="166" cy="42" r="12" fill="#7c6bff" opacity="0.35"/>
    <circle cx="182" cy="42" r="12" fill="#1f2745"/>
    <text x="182" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b90a8">+2</text>
  </g>

  <g transform="translate(380 196)">
    <rect x="0" y="0" width="196" height="88" rx="16" fill="#151b33" stroke="#2a3050" stroke-width="1.2" opacity="0.96"/>
    <text x="18" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b90a8">Weekly spend</text>
    <rect x="18" y="42" width="14" height="28" rx="4" fill="#242b4d"/>
    <rect x="38" y="34" width="14" height="36" rx="4" fill="#242b4d"/>
    <rect x="58" y="46" width="14" height="24" rx="4" fill="#242b4d"/>
    <rect x="78" y="26" width="14" height="44" rx="4" fill="url(#fp-acc)"/>
    <rect x="98" y="40" width="14" height="30" rx="4" fill="#242b4d"/>
    <rect x="118" y="50" width="14" height="20" rx="4" fill="#242b4d"/>
    <rect x="138" y="36" width="14" height="34" rx="4" fill="#242b4d"/>
  </g>

  <g transform="translate(608 128)">
    <rect x="0" y="0" width="118" height="118" rx="22" fill="url(#fp-acc)" opacity="0.16"/>
    <rect x="12" y="12" width="94" height="94" rx="16" fill="#151b33" stroke="#2a3050" stroke-width="1.2"/>
    <circle cx="59" cy="52" r="21" stroke="url(#fp-acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="100 132"/>
    <text x="59" y="57" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f4f7">76%</text>
    <text x="59" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8b90a8">Goal reached</text>
  </g>

  <text x="380" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#f4f4f7">FluxPay</text>
  <text x="380" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b90a8">Mobile fintech payment app · UI/UX</text>
  <rect x="380" y="374" width="66" height="4" rx="2" fill="url(#fp-acc)"/>
</svg>
