<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Doctor consultancy mobile app mockup">
  <defs>
    <linearGradient id="dr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08182a"/>
      <stop offset="100%" stop-color="#132444"/>
    </linearGradient>
    <linearGradient id="dr-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ac7ff"/>
      <stop offset="100%" stop-color="#5ee0c0"/>
    </linearGradient>
    <radialGradient id="dr-glow">
      <stop offset="0%" stop-color="#3ac7ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3ac7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dr-bg)"/>
  <circle cx="150" cy="380" r="220" fill="url(#dr-glow)"/>
  <circle cx="680" cy="110" r="190" fill="url(#dr-glow)"/>

  <!-- Main phone -->
  <g transform="translate(286 40)">
    <rect x="0" y="0" width="232" height="420" rx="36" fill="#0f2140" stroke="#28466e" stroke-width="1.6"/>
    <rect x="9" y="9" width="214" height="402" rx="29" fill="#0b1b33"/>
    <rect x="93" y="20" width="46" height="6" rx="3" fill="#28466e"/>

    <text x="24" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7f95b5">Good morning</text>
    <text x="24" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f7ff">Find your doctor</text>

    <!-- Search -->
    <rect x="24" y="92" width="184" height="30" rx="15" fill="#13294a"/>
    <circle cx="42" cy="107" r="5.5" stroke="#5b7ca8" stroke-width="1.8" fill="none"/>
    <path d="M46 111l4 4" stroke="#5b7ca8" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="58" y="103" width="70" height="7" rx="3.5" fill="#1e365c"/>

    <!-- Specialty chips -->
    <g>
      <rect x="24" y="134" width="56" height="52" rx="14" fill="url(#dr-acc)" opacity="0.9"/>
      <path d="M46 152v14M39 159h14" stroke="#062033" stroke-width="2.6" stroke-linecap="round"/>
      <text x="52" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#062033">General</text>

      <rect x="88" y="134" width="56" height="52" rx="14" fill="#13294a"/>
      <path d="M116 149c-6 0-9 8-3 13l3 3 3-3c6-5 3-13-3-13z" fill="#3ac7ff" opacity="0.75"/>
      <text x="116" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#7f95b5">Cardio</text>

      <rect x="152" y="134" width="56" height="52" rx="14" fill="#13294a"/>
      <circle cx="180" cy="156" r="9" stroke="#5ee0c0" stroke-width="2.4" fill="none"/>
      <text x="180" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#7f95b5">Neuro</text>
    </g>

    <text x="24" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#7f95b5">Top rated</text>

    <!-- Doctor cards -->
    <g>
      <rect x="24" y="220" width="184" height="66" rx="16" fill="#13294a" stroke="#3ac7ff" stroke-width="1.2"/>
      <circle cx="52" cy="253" r="19" fill="#1d3a63"/>
      <circle cx="52" cy="246" r="7" fill="#5b7ca8"/>
      <path d="M40 266c2-8 22-8 24 0z" fill="#5b7ca8"/>
      <text x="80" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#f2f7ff">Dr. A. Sharma</text>
      <text x="80" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#7f95b5">Cardiologist · 12 yrs</text>
      <text x="80" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#ffc857">★ 4.9</text>
      <rect x="152" y="262" width="46" height="16" rx="8" fill="url(#dr-acc)"/>
      <text x="175" y="273" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#062033">Book</text>

      <rect x="24" y="294" width="184" height="66" rx="16" fill="#13294a"/>
      <circle cx="52" cy="327" r="19" fill="#1d3a63"/>
      <circle cx="52" cy="320" r="7" fill="#5b7ca8"/>
      <path d="M40 340c2-8 22-8 24 0z" fill="#5b7ca8"/>
      <text x="80" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#f2f7ff">Dr. M. Roy</text>
      <text x="80" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#7f95b5">Physician · 8 yrs</text>
      <text x="80" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#ffc857">★ 4.7</text>
      <rect x="152" y="336" width="46" height="16" rx="8" fill="#1e365c"/>
      <text x="175" y="347" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#8fb4dc">Book</text>
    </g>

    <!-- Tab bar -->
    <rect x="24" y="372" width="184" height="30" rx="15" fill="#13294a"/>
    <circle cx="52" cy="387" r="5" fill="#3ac7ff"/>
    <circle cx="98" cy="387" r="5" fill="#33527d"/>
    <circle cx="144" cy="387" r="5" fill="#33527d"/>
    <circle cx="188" cy="387" r="5" fill="#33527d"/>
  </g>

  <!-- Left floating: appointment slots -->
  <g transform="translate(56 128)">
    <rect x="0" y="0" width="200" height="128" rx="18" fill="#0f2140" stroke="#28466e" stroke-width="1.2"/>
    <text x="18" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#7f95b5">Pick a slot</text>
    <rect x="18" y="40" width="52" height="26" rx="9" fill="#13294a"/>
    <text x="44" y="57" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb4dc">09:00</text>
    <rect x="76" y="40" width="52" height="26" rx="9" fill="url(#dr-acc)"/>
    <text x="102" y="57" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#062033">10:30</text>
    <rect x="134" y="40" width="52" height="26" rx="9" fill="#13294a"/>
    <text x="160" y="57" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb4dc">12:00</text>
    <rect x="18" y="74" width="52" height="26" rx="9" fill="#13294a"/>
    <text x="44" y="91" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb4dc">14:15</text>
    <rect x="76" y="74" width="52" height="26" rx="9" fill="#13294a"/>
    <text x="102" y="91" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb4dc">16:00</text>
    <rect x="134" y="74" width="52" height="26" rx="9" fill="#13294a"/>
    <text x="160" y="91" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fb4dc">18:30</text>
    <rect x="18" y="108" width="168" height="4" rx="2" fill="url(#dr-acc)" opacity="0.5"/>
  </g>

  <!-- Right floating: video consult -->
  <g transform="translate(556 152)">
    <rect x="0" y="0" width="190" height="112" rx="18" fill="#0f2140" stroke="#28466e" stroke-width="1.2"/>
    <rect x="16" y="16" width="158" height="60" rx="12" fill="#16305a"/>
    <circle cx="95" cy="42" r="14" fill="#2b4b7d"/>
    <circle cx="95" cy="37" r="5.5" fill="#7f9fc8"/>
    <path d="M86 52c2-6 16-6 18 0z" fill="#7f9fc8"/>
    <circle cx="152" cy="62" r="10" fill="#0b1b33" stroke="#28466e" stroke-width="1"/>
    <text x="16" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7f95b5">Live consultation</text>
    <circle cx="160" cy="94" r="9" fill="#ef4444"/>
    <rect x="156" y="90" width="8" height="8" rx="2" fill="#ffffff"/>
  </g>

  <text x="286" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f95b5">Doctor consultancy app · mobile UI/UX design</text>
</svg>
